# Render Blueprint: 백엔드 서버 + PostgreSQL
# Render 대시보드 → New → Blueprint → 이 저장소 선택. sync: false 인 값은 처음 만들 때 직접 넣는다
services:
  - type: web
    name: onroad-api
    runtime: python
    plan: free
    region: singapore          # 한국과 가장 가까운 곳
    branch: develop
    buildCommand: >-
      pip install -r src/backend/requirements.txt &&
      cd src && python -m rag.index
    # db.seed: policies.json 의 정책(수집 정책 G · W 포함)을 DB 에 넣는다. --dummy-action keep 으로 더미는 그대로 두고,
    # 그 뒤 demo_seed 가 시연 정책(P001 · 더미) 노출을 다시 맞춘다. 시드가 실패해도 이전 정책으로 서버는 켠다
    # (policies.json 은 저장 전에 같은 시드 검사를 거침: src/collector/pipeline.py)
    startCommand: >-
      cd src/backend &&
      alembic upgrade head &&
      (python -m db.seed --dummy-action keep || echo "[seed] 실패: 이전 정책으로 계속") &&
      python -m db.demo_seed --if-missing &&
      uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        fromDatabase:
          name: onroad-db
          property: connectionString
      - key: RAG_MODE
        value: real
      - key: LLM_MODE
        value: real
      - key: OPENAI_API_KEY
        sync: false
      - key: DATA_GO_KR_SERVICE_KEY
        sync: false
      - key: DOC_SECRET_KEY
        generateValue: true     # 서류 암호화 키. 한 번 만들어지면 바꾸지 않는다 (바꾸면 기존 서류를 못 푼다)
      - key: TZ
        value: Asia/Seoul

databases:
  - name: onroad-db
    plan: free
    region: singapore
    databaseName: onroad
    user: onroad
